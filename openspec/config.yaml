schema: spec-driven

context: |
  Doppelkopf als Multiplayer-Webspiel (Schwesterprojekt von ~/dev/Ausgebremst und
  ~/dev/portale-von-molthar). Tech: Bun-Workspaces (shared, backend, game-web),
  TypeScript strict, boardgame.io 0.50 (Server + Socket.IO), React 19 + Vite + Tailwind 4.
  Produktion: Single Binary (bun build --compile) als systemd-Dienst hinter Traefik
  auf dem vServer, Domain doppelkopf.apps.diefranks.eu, Port 3003 auf 172.18.0.1.
  Specs und Texte auf Deutsch. Tests mit bun test.

