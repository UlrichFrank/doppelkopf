# Traefik dynamic configuration (file provider) for Doppelkopf.
# Installed to /etc/traefik/dynamic/doppelkopf.yml by `make deploy`;
# Traefik picks up changes without a restart (providers.file.watch).
#
# Uses the existing wildcard certificate *.apps.diefranks.eu of the
# "letsencrypt" resolver — no new certificate is requested.
#
# Only for members of the Spielothek: the middleware spielothek-auth@file
# (defined in the Spielothek's route file) asks apps.diefranks.eu before every
# request and sends visitors without a session to its login page.
http:
  routers:
    doppelkopf:
      rule: "Host(`doppelkopf.apps.diefranks.eu`)"
      entryPoints:
        - websecure
      service: doppelkopf
      middlewares:
        - spielothek-auth@file
      tls:
        certResolver: letsencrypt
        domains:
          - main: "*.apps.diefranks.eu"

  services:
    doppelkopf:
      loadBalancer:
        servers:
          # Loopback of the host, where the binary listens
          - url: "http://127.0.0.1:3003"
